name: Flutter

# APK/AAB builds are intentionally omitted: ubuntu-latest has no Android SDK.
# See docs/release/android_ci_notes.md and docs/release/android_sdk_blocker.md.
# Optional self-hosted Android job may be added when ANDROID_HOME is available.

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Integration journeys (mock, flutter-tester)
        run: flutter test integration_test -d flutter-tester
      - name: Android SDK probe (informational)
        run: |
          set +e
          ./scripts/check_android_sdk.sh
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Android SDK not available on this runner (expected). Skipping APK/AAB."
          fi
          exit 0
